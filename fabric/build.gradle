plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modImplementation "maven.modrinth:modmenu:${modmenu_version}"

    modImplementation("dev.ultreon.mods:xinexlib-fabric-1.21.1:0.1.0-SNAPSHOT")

    include implementation(api(library("space.earlygrey:shapedrawer:$shapedrawer_version")))
    include implementation(api(library("com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdx_version") {
        exclude group: "org.lwjgl.lwjgl"
        exclude group: "org.lwjgl"
    }))
    include implementation(api(library("com.badlogicgames.gdx:gdx:$gdx_version")))
    include implementation(api(library("com.badlogicgames.gdx:gdx-platform:$gdx_version:natives-desktop")))
    include library('io.projectreactor:reactor-core:3.5.5')
    include library('org.reactivestreams:reactive-streams:1.0.4')
    include library('org.hjson:hjson:3.1.0')
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
